name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 17 toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm-17-dev clang-17 cmake make g++ zlib1g-dev libzstd-dev

      - name: Configure
        run: cmake -S . -B build -DLT_LLVM_INSTALL_DIR=/usr/lib/llvm-17

      - name: Build pass plugin
        run: cmake --build build -j

      - name: Run golden-file tests
        working-directory: tests
        run: OPT=/usr/lib/llvm-17/bin/opt bash run_tests.sh
